<section class="documents-preview">
  <h3 class="section-title">Latest Documents</h3>
  <div class="documents-grid">
    <div class="document-card" *ngFor="let doc of [1,2,3,4]">
      <div class="document-card-title">Quarterly Update Report</div>
      <div class="document-card-meta">Issued on 23 July 2025</div>
      <div class="document-card-actions">
        <div class="document-card-action" title="View"><span class="icon-square" aria-hidden="true"></span></div>
        <div class="document-card-action" title="Download"><span class="icon-square" aria-hidden="true"></span></div>
      </div>
    </div>
  </div>
</section>

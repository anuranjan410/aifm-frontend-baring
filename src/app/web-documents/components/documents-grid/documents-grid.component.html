<section class="documents-grid-section">
  <div class="documents-grid">
    <div class="document-card" *ngFor="let d of documents">
      <div class="document-card-title">{{ d.title }}</div>
      <div class="document-card-meta">{{ d.date }}</div>
      <div class="document-card-actions">
        <div class="document-card-action" title="View"><span class="icon-square" aria-hidden="true"></span></div>
        <div class="document-card-action" title="Download"><span class="icon-square" aria-hidden="true"></span></div>
      </div>
    </div>
  </div>
</section>

<section class="distribution-chart">
  <div class="distribution-header">
    <div class="distribution-title-wrapper">
      <h3 class="distribution-title">{{ title }}</h3>
      <span class="icon-square" aria-hidden="true"></span>
    </div>
    <div class="distribution-controls" *ngIf="showFilters">
      <button class="btn-icon" (click)="onFilterClick()"><span class="icon-square" aria-hidden="true"></span><span class="btn-text">Filter</span></button>
    </div>
  </div>
  <div class="distribution-content">
    <div class="chart-container">
      <div class="pie-chart">
        <div class="pie-chart-placeholder"></div>
      </div>
      <div class="chart-legend">
        <h4 class="legend-title">Industry Sectors</h4>
        <div class="legend-items">
          <div *ngFor="let item of industryData" class="legend-item">
            <div class="legend-color" [style.background-color]="item.color"></div>
            <span class="legend-label">{{ item.name }}</span>
            <span class="legend-percentage">{{ item.percentage }}%</span>
            <span class="icon-square" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
